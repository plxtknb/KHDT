<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt Kế hoạch đầu tư 2027</title>
<style>
:root{--navy:#0b2e5c;--navy2:#143f7a;--red:#d71920;--bg:#f2f5f9;--card:#fff;--line:#dde3ec;--tx:#1b2a3f;--mu:#6b7a90;--ok:#1f9d55;--okbg:#e6f6ec;--okline:#9bd9b4;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(100deg,var(--navy),var(--navy2));color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:4px solid var(--red)}
header h1{font-size:19px;margin:0;letter-spacing:.3px}header small{opacity:.8;display:block;font-size:12px;font-weight:400}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 13px;border-radius:7px;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{background:#eef3fa}.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.red{color:var(--red)}
header .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}header .btn:hover{background:rgba(255,255,255,.25)}
main{max-width:1500px;margin:0 auto;padding:18px 24px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;border-top:3px solid var(--navy)}
.kpi .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.kpi .v{font-size:26px;font-weight:700;color:var(--navy)}.kpi .s{color:var(--mu);font-size:12px}
.kpi.g{border-top-color:var(--ok)}.kpi.g .v{color:var(--ok)}.kpi.r{border-top-color:var(--red)}
.bar0{height:7px;background:#e6ebf2;border-radius:4px;margin-top:6px;overflow:hidden}.bar0>i{display:block;height:100%;background:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase}
tr.u{cursor:pointer}tr.u:hover{background:#f0f5fc}tr.u.on{background:#e3edfb;font-weight:600}tr.tot td{font-weight:700;background:#f6f8fb}
.mini{display:inline-block;width:110px;height:8px;background:#e6ebf2;border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}.mini i{display:block;height:100%;background:var(--navy2)}
.fg{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.fg>div{min-width:150px}
.fl{font-size:11px;text-transform:uppercase;color:var(--mu);letter-spacing:.5px;margin-bottom:5px;font-weight:600}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:18px;padding:4px 12px;margin:0 5px 5px 0;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--navy2)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip em{font-style:normal;opacity:.65;font-size:12px;margin-left:4px}
.chip.sub{border-style:dashed;font-size:13px;padding:3px 10px}.chip.sub.on{background:var(--navy2)}
input,select,textarea{font:inherit;border:1px solid #c9d2df;border-radius:6px;padding:7px 9px;width:100%;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8e0;border-color:var(--navy2)}
.srch{max-width:260px}
.listhead{display:flex;align-items:center;gap:12px;margin:6px 0 10px;flex-wrap:wrap}.listhead b{color:var(--navy);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy2);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative;transition:.12s}
.card:hover{box-shadow:0 4px 14px rgba(11,46,92,.15);transform:translateY(-1px)}
.card.ok{background:var(--okbg);border-color:var(--okline);border-left-color:var(--ok)}
.card.edited:after{content:"đã sửa";position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--warn);font-weight:600}
.card .t{font-weight:600;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:60px;padding-right:26px}
.card .tick{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;text-align:center;line-height:22px;font-size:14px}
.card .v{font-size:19px;font-weight:700;color:var(--navy)}.card.ok .v{color:#157a42}.card .v small{font-size:12px;font-weight:400;color:var(--mu)}
.tags{margin-top:7px}.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e8eef7;color:var(--navy);margin-right:4px;font-weight:600}
.tag.dv{background:var(--navy);color:#fff}.tag.m{background:#fdecea;color:var(--red)}.tag.c{background:#fff4dc;color:#8a5a00}
.empty{padding:40px;text-align:center;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(10,25,48,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:10}
.ov.show{display:flex}
.modal{background:#fff;border-radius:12px;width:min(1080px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.mh{background:var(--navy);color:#fff;padding:14px 22px;display:flex;gap:12px;align-items:center}.mh h2{margin:0;font-size:16px;flex:1}.mh .x{cursor:pointer;font-size:24px;line-height:1;opacity:.8}
.mh.ok{background:var(--ok)}
.mb{padding:18px 22px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px 14px}
.mb label{display:block;font-size:11px;text-transform:uppercase;color:var(--mu);font-weight:600;margin-bottom:3px;letter-spacing:.4px}
.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}.c3{grid-column:span 3}
.mf{padding:14px 22px;background:#f6f8fb;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mf .sp{flex:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12263f;color:#fff;padding:10px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1}
nav{display:flex;gap:4px;margin-left:12px}
nav .tab{background:transparent;border:0;color:#fff;opacity:.7;font:inherit;font-weight:700;padding:9px 18px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:3px solid transparent}
nav .tab:hover{opacity:1;background:rgba(255,255,255,.1)}nav .tab.on{opacity:1;background:rgba(255,255,255,.18);border-bottom-color:#fff}
.view{display:none}.view.on{display:block}
.note{background:#fff8e5;border:1px solid #f1d58a;color:#7a5200;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.note a{color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline}
/* màu phân loại tương phản */
.tag.loai-dt{background:#0d47a1;color:#fff}.tag.loai-scl{background:#ef6c00;color:#fff}
.tag.tt-m{background:#c2185b;color:#fff}.tag.tt-c{background:#fff;color:#37474f;border:1.5px solid #37474f}
.tag{font-size:12px;padding:3px 10px}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid transparent}
.dot.loai-dt{background:#0d47a1}.dot.loai-scl{background:#ef6c00}.dot.tt-m{background:#c2185b}.dot.tt-c{background:#fff;border-color:#37474f}
.card.l-dt{border-left-color:#0d47a1}.card.l-scl{border-left-color:#ef6c00}.card.ok{border-left-color:var(--ok)}
.btn.sortOn{background:var(--navy);color:#fff;border-color:var(--navy)}
/* modal tập trung */
.modal{transition:none}
.mb .key label{font-size:12px}
.key textarea,.key input{border-color:#9db8e0;background:#fbfdff}
.k-ten textarea{font-size:21px;font-weight:700;line-height:1.35;color:var(--navy)}
.k-gt input{font-size:26px;font-weight:700;color:var(--navy)}
.k-sc textarea{font-size:17px;line-height:1.55}
.k-yk textarea{font-size:16px}
.sec{grid-column:span 12;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);font-weight:600}
.mb .minor label{font-size:10px}.mb .minor input,.mb .minor select,.mb .minor textarea{font-size:12px;padding:5px 7px;color:#44546a}
@media(max-width:700px){.c8,.c6,.c4,.c3{grid-column:span 12}main{padding:12px}}
@media print{header .btn,.fg,.btn{display:none}}

 <div class="kpi"><div class="l">Chuyển tiếp / Mới</div><div class="v" style="font-size:20px;padding:4px 0">${fmt(sum(f.filter(o=>o.tinhTrang==='Chuyển tiếp')))} / ${fmt(sum(f.filter(o=>o.tinhTrang==='Mới')))}</div><div class="s">${f.filter(o=>o.tinhTrang==='Chuyển tiếp').length} / ${f.filter(o=>o.tinhTrang==='Mới').length} dự án</div></div>

 const nf=['dv','br','loai','tt','duyet'].some(k=>F[k].size)||F.q;
 $('#dashNote').innerHTML=nf?'<div class="note">Đang áp bộ lọc — số liệu dưới đây chỉ gồm các dự án phù hợp. <a data-go="ct">Xem danh sách chi tiết →</a> <a data-clr="1">Xóa lọc</a></div>':'';

 // unit table (respect all filters except dv so rows stay visible)
 const base=data.filter(o=>match(o,'dv')),mx=Math.max(1,...dvs.map(d=>sum(base.filter(o=>o.dv===d))));
 let rows='',tn=0,tv=0,ta=0,tav=0;
 dvs.forEach(d=>{const a=base.filter(o=>o.dv===d);if(!a.length&&!F.dv.has(d))return;const v=sum(a),ac=a.filter(o=>o.duyet);tn+=a.length;tv+=v;ta+=ac.length;tav+=sum(ac);
  const sel=F.dv.has(d);
  rows+=`<tr class="u ${sel?'on':''}" data-k="dv" data-v="${esc(d)}"><td>${esc(d)}</td><td>${a.length}</td><td><span class="mini"><i style="width:${v/mx*100}%"></i></span>${fmt(v)}</td><td>${sum(a.filter(o=>o.loai==='Đầu tư')).toLocaleString('vi-VN')}</td><td>${fmt(sum(a.filter(o=>o.loai!=='Đầu tư')))}</td><td>${ac.length}/${a.length}</td><td>${fmt(sum(ac))}</td></tr>`;
  if(d==='TKNB'&&sel)['QLKT','THTĐH',''].forEach(b=>{const s=a.filter(o=>(o.nhanh||'')===b);if(!s.length)return;rows+=`<tr style="color:var(--mu);font-size:13px"><td style="padding-left:28px">↳ TKNB-${b||'Khác'}</td><td>${s.length}</td><td>${fmt(sum(s))}</td><td>${fmt(sum(s.filter(o=>o.loai==='Đầu tư')))}</td><td>${fmt(sum(s.filter(o=>o.loai!=='Đầu tư')))}</td><td>${s.filter(o=>o.duyet).length}/${s.length}</td><td>${fmt(sum(s.filter(o=>o.duyet)))}</td></tr>`})});
 $('#unitTbl').innerHTML=`<tr><th>Đơn vị</th><th>Số DA</th><th>Giá trị KH</th><th>Đầu tư</th><th>SCL</th><th>Đã duyệt</th><th>GT đã duyệt</th></tr>${rows}<tr class="tot"><td>Cộng</td><td>${tn}</td><td>${fmt(tv)}</td><td>${fmt(sum(base.filter(o=>o.loai==='Đầu tư')))}</td><td>${fmt(sum(base.filter(o=>o.loai!=='Đầu tư')))}</td><td>${ta}/${tn}</td><td>${fmt(tav)}</td></tr>`;
 // list
 $('#lh').textContent=`Danh sách dự án (${f.length})`;$('#lh2').textContent=`Tổng ${fmt(tot)} triệu đồng`;
 $('#grid').innerHTML=f.length?f.map(o=>`<div class="card ${o.loai==='Đầu tư'?'l-dt':'l-scl'} ${o.duyet?'ok':''} ${orig.get(o.id)!==JSON.stringify(o)?'edited':''}" data-id="${o.id}">${o.duyet?'<div class="tick">✓</div>':''}<div class="t">${o.stt?'<span style="color:var(--mu)">'+esc(o.stt)+'.</span> ':''}${esc(o.ten)}</div><div class="v">${fmt(o.giaTri)} <small>triệu đồng</small></div><div class="tags"><span class="tag dv">${esc(o.dv)}${o.nhanh?'-'+esc(o.nhanh):''}</span><span class="tag ${o.loai==='Đầu tư'?'loai-dt':'loai-scl'}">${esc(o.loai)}</span><span class="tag ${o.tinhTrang==='Mới'?'tt-m':'tt-c'}">${esc(o.tinhTrang)}</span></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Không có dự án phù hợp bộ lọc.</div>';
}
function setView(v){view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v'+(v==='dash'?'Dash':'Ct')));document.querySelectorAll('nav .tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));window.scrollTo(0,0)}
document.querySelectorAll('nav .tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));
$('#bSort').onclick=()=>{sortDesc=!sortDesc;render()};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-go]')){setView('ct');return}
 if(e.target.closest('[data-clr]')){$('#bClear').click();return}
 const c=e.target.closest('[data-k]');
 if(c){const k=c.dataset.k,v=c.dataset.v;F[k].has(v)?F[k].delete(v):F[k].add(v);if(k==='dv'&&!F.dv.has('TKNB'))F.br.clear();render();return}
 const card=e.target.closest('.card');if(card){const r=card.getBoundingClientRect();openM(+card.dataset.id,r.left+r.width/2,r.top+r.height/2)}});
$('#q').oninput=e=>{F.q=e.target.value;render()};
$('#bClear').onclick=()=>{Object.keys(F).forEach(k=>k==='q'?F.q='':F[k].clear());$('#q').value='';render()};
// ---- modal
let cur=null,seq=[];
const FIELDS=[['ten','Tên dự án','c12 key k-ten','area3'],['giaTri','Giá trị KH (triệu đồng)','c4 key k-gt','num'],['suCan','Sự cần thiết đầu tư & quy mô','c12 key k-sc','area8'],['ykien','Ý kiến / kết luận phiên duyệt','c12 key k-yk','area3'],
['_sec','Thông tin khác'],['stt','STT gốc','c3 minor'],['dv','Đơn vị thực hiện','c3 minor','dv'],['nhanh','Nhánh (TKNB)','c3 minor','br'],['loai','Đầu tư / SCL','c3 minor','loai'],['tinhTrang','Mới / Chuyển tiếp','c3 minor','tt'],['nhomMuc','Nhóm hạng mục','c6 minor'],
['diaDiem','Địa điểm','c12 minor','area2'],['ghiChu','Ghi chú (chỉ hiển thị)','c12 minor','area2']];
function openM(id,x,y){cur=data.find(o=>o.id===id);seq=getList().map(o=>o.id);drawM();const ov=$('#ov');ov.classList.add('show');
 if(x!=null&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  const m=$('#modal'),r=m.getBoundingClientRect(),ox=x-r.left,oy=y-r.top,R=Math.hypot(Math.max(ox,r.width-ox),Math.max(oy,r.height-oy))+20;
  ov.animate([{background:'rgba(10,25,48,0)'},{background:'rgba(10,25,48,.55)'}],{duration:450,easing:'ease-out'});
  m.animate([{clipPath:`circle(0px at ${ox}px ${oy}px)`,opacity:.6},{clipPath:`circle(${R}px at ${ox}px ${oy}px)`,opacity:1}],{duration:520,easing:'cubic-bezier(.22,.8,.3,1)'})}}
function drawM(){
 const o=cur,i=seq.indexOf(o.id);
 const inp=([k,l,c,t])=>{let h;const v=o[k]??'';if(k==='_sec')return `<div class="sec">${l}</div>`;
  if(t==='area'||t&&t.startsWith('area'))h=`<textarea data-f="${k}" rows="${t==='area'?2:+t.slice(4)}">${esc(v)}</textarea>`;
  else if(t==='dv')h=`<select data-f="dv">${DVS.map(d=>`<option ${d===v?'selected':''}>${d}</option>`).join('')}</select>`;
  else if(t==='loai')h=`<select data-f="loai">${['Đầu tư','Sửa chữa lớn'].map(d=>`<option ${d===v?'selected':''}>${d}</option>`).join('')}</select>`;
  else if(t==='tt')h=`<select data-f="tinhTrang">${['Mới','Chuyển tiếp'].map(d=>`<option ${d===v?'selected':''}>${d}</option>`).join('')}</select>`;
  else if(t==='br')h=`<select data-f="nhanh">${['','QLKT','THTĐH'].map(d=>`<option value="${d}" ${d===v?'selected':''}>${d||'—'}</option>`).join('')}</select>`;
  else if(t==='pri')h=`<select data-f="uuTien">${['','1','2','3','4','5'].map(d=>`<option value="${d}" ${d===v?'selected':''}>${d||'—'}</option>`).join('')}</select>`;
  else if(t==='num')h=`<input data-f="giaTri" type="number" step="any" value="${v}">`;
  else h=`<input data-f="${k}" value="${esc(v)}">`;
  return `<div class="${c}"><label>${l}</label>${h}</div>`};
 const tg=`<div class="c8" style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap"><span class="tag dv" style="font-size:13px">${esc(o.dv)}${o.nhanh?'-'+esc(o.nhanh):''}</span><span class="tag ${o.loai==='Đầu tư'?'loai-dt':'loai-scl'}" style="font-size:13px">${esc(o.loai)}</span><span class="tag ${o.tinhTrang==='Mới'?'tt-m':'tt-c'}" style="font-size:13px">${esc(o.tinhTrang)}</span></div>`;
 $('#modal').innerHTML=`<div class="mh ${o.duyet?'ok':''}"><h2>${o.duyet?'✓ ĐÃ DUYỆT — ':''}${esc(o.ten.slice(0,110))}</h2><span class="x" id="mx">×</span></div>
 <div class="mb">${FIELDS.slice(0,2).map(inp).join('')}${tg}${FIELDS.slice(2).map(inp).join('')}</div>
 <div class="mf"><button class="btn" id="mp" ${i<=0?'disabled':''}>← Trước</button><button class="btn" id="mn" ${i>=seq.length-1?'disabled':''}>Sau →</button><span style="color:var(--mu)">${i+1}/${seq.length} theo bộ lọc</span><div class="sp"></div>
 <button class="btn red" id="md">Xóa dự án</button><button class="btn pri" id="ms">Lưu</button>${o.duyet?'<button class="btn" id="mu">Bỏ duyệt</button>':''}<button class="btn ok" id="ma">${o.duyet?'Lưu & hạng mục tiếp ›':'✓ Duyệt & chuyển hạng mục tiếp'}</button></div>`;
 $('#mx').onclick=closeM;$('#mp').onclick=()=>go(-1);$('#mn').onclick=()=>go(1);
 $('#ms').onclick=()=>{collect();save();render();toast('Đã lưu');drawM()};
 $('#ma').onclick=()=>{collect();cur.duyet=true;save();toast('Đã duyệt');next()};
 if($('#mu'))$('#mu').onclick=()=>{collect();cur.duyet=false;save();render();drawM();toast('Đã bỏ duyệt')};
 $('#md').onclick=()=>{if(confirm('Xóa dự án này khỏi danh sách?')){data=data.filter(x=>x!==cur);save();closeM();toast('Đã xóa')}};
}
function collect(){document.querySelectorAll('#modal [data-f]').forEach(el=>{const k=el.dataset.f;cur[k]=k==='giaTri'?(parseFloat(el.value)||0):el.value});if(cur.dv!=='TKNB')cur.nhanh=''}
function go(d){collect();save();const i=seq.indexOf(cur.id)+d;if(i>=0&&i<seq.length){cur=data.find(o=>o.id===seq[i]);render();drawM();$('#ov').scrollTop=0}}
function next(){const i=seq.indexOf(cur.id);let j=seq.slice(i+1).find(id=>!data.find(o=>o.id===id)?.duyet);render();
 if(j!==undefined){cur=data.find(o=>o.id===j);drawM();$('#ov').scrollTop=0}else{closeM();toast('Đã hết hạng mục chưa duyệt trong bộ lọc')}}
function closeM(){$('#ov').classList.remove('show');render()}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('show'))closeM()});
// ---- toolbar
$('#bAdd').onclick=()=>{const o={id:Math.max(0,...data.map(x=>x.id))+1,row:0,stt:'',ten:'Dự án mới',diaDiem:'',nguonVon:'',khoiCong:'',hoanThanh:'',giaTri:0,suCan:'',dv:'CNĐT',nhanh:'',loai:'Đầu tư',tinhTrang:'Mới',nhomLon:'',nhomMuc:'',ghiChu:'',ykien:'',duyet:false};data.push(o);save();render();openM(o.id)};
$('#bJson').onclick=()=>dl(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),'KHDT2027_saoluu_'+ymd()+'.json');
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;data=d;save();render();toast('Đã nhập '+d.length+' dự án')}catch(x){alert('File không hợp lệ')}});e.target.value=''};
$('#bReset').onclick=()=>{if(confirm('Xóa mọi chỉnh sửa và duyệt, quay về dữ liệu Excel gốc?')){data=JSON.parse(JSON.stringify(ORIGINAL));save();render();toast('Đã khôi phục dữ liệu gốc')}};
const ymd=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#bXls').onclick=()=>{
 const H=['STT','Tên dự án','Địa điểm','Nguồn vốn','Khởi công','Hoàn thành','Giá trị KH (triệu đồng)','Sự cần thiết đầu tư & quy mô','Đơn vị thực hiện','Nhánh','Đầu tư/SCL','Mới/Chuyển tiếp','Nhóm hạng mục','Ghi chú','Ý kiến phiên duyệt','Trạng thái duyệt'];
 const R=data.map(o=>[o.stt,o.ten,o.diaDiem,o.nguonVon,o.khoiCong,o.hoanThanh,+o.giaTri||0,o.suCan,o.dv,o.nhanh,o.loai,o.tinhTrang,o.nhomMuc,o.ghiChu,o.ykien,o.duyet?'Đã duyệt':'Chưa duyệt']);
 if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet([H,...R]);ws['!cols']=[6,60,24,14,12,12,16,60,12,10,14,14,24,30,40,14].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'KH2027');XLSX.writeFile(wb,'KHDT2027_phien_duyet_'+ymd()+'.xlsx');}
 else{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl(new Blob(['﻿'+[H,...R].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),'KHDT2027_phien_duyet_'+ymd()+'.csv');toast('Không tải được thư viện Excel (cần mạng) — đã xuất CSV')}};
render();
</script></body></html>
